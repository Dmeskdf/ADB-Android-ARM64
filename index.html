<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原谅我好不好吗？</title>

<style>
    :root {
        --bg: #fff5f7;
        --text: #1c1c1e;
        --yes: #34c759;
        --no: #ff453a;
    }

    * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
    }

    body {
        margin: 0;
        height: 100vh;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, "Helvetica Neue", Arial;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .question {
        font-size: 2.8rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 56px;
        opacity: 0;
        transform: translateY(20px);
        animation: iosFadeIn 0.6s cubic-bezier(.23,1.02,.52,.98) forwards;
    }

    .buttons {
        display: flex;
        gap: 32px;
    }

    .btn {
        padding: 14px 44px;
        font-size: 1.4rem;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        color: #fff;
        will-change: transform;
    }

    .yes-btn {
        background: var(--yes);
        box-shadow: 0 10px 30px rgba(52,199,89,.35);
    }

    .yes-btn:active {
        transform: scale(0.94);
    }

    .no-btn {
        background: var(--no);
        box-shadow: 0 10px 30px rgba(255,69,58,.35);
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.45s cubic-bezier(.23,1.02,.52,.98);
    }

    .toast {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.85);
        background: rgba(0,0,0,.85);
        color: #fff;
        padding: 16px 36px;
        border-radius: 30px;
        font-size: 1.2rem;
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s cubic-bezier(.23,1.02,.52,.98);
    }

    .toast.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    @keyframes iosFadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* 爱心 */
    .heart {
        position: fixed;
        pointer-events: none;
        font-size: 18px;
        animation: heartFly 1.2s ease-out forwards;
        z-index: 9999;
    }

    @keyframes heartFly {
        0% {
            opacity: 1;
            transform: translate(0, 0) scale(1);
        }
        100% {
            opacity: 0;
            transform: translate(var(--tx), var(--ty)) scale(0.4);
        }
    }
</style>
</head>

<body>
    <div class="question">原谅我,好不好吗?</div>

    <div class="buttons">
        <button class="btn yes-btn" id="yesBtn">Yes</button>
        <button class="btn no-btn" id="noBtn">No</button>
    </div>

    <div class="toast" id="toast">爱你宝宝🥰</div>

    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const toast = document.getElementById("toast");

        yesBtn.addEventListener("click", () => {
            showToast();
            launchHearts();
        });

        noBtn.addEventListener("pointerdown", e => {
            e.preventDefault();
            moveNoOut();
        });

        function showToast() {
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2200);
        }

        function moveNoOut() {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.max(window.innerWidth, window.innerHeight) * 1.2;

            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            noBtn.style.transform = `translate(${tx}px, ${ty}px)`;
        }
        
        function launchHearts() {
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = ["💗","💖","💕","❤️"][Math.floor(Math.random()*4)];
                heart.style.left = `${window.innerWidth/2}px`;
                heart.style.top = `${window.innerHeight/2}px`;
                heart.style.fontSize = `${14 + Math.random() * 16}px`;
                heart.style.setProperty("--tx", `${(Math.random()-0.5)*700}px`);
                heart.style.setProperty("--ty", `${(Math.random()-0.5)*700}px`);
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1200);
            }
        }
    </script>
</body>
</html>
